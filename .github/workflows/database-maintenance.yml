```yaml
name: Database Maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose the database task"
        required: true
        type: choice
        options:
          - preview_duplicates
          - enrich_players
          - cleanup_and_enrich

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run database maintenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACTION_CHOICE: ${{ inputs.action }}
        run: |
          set -e

          cd ipl-multiplayer-auction/server
          npm install --no-package-lock

          echo "Applying database schema..."
          npm run db:schema

          if [ "$ACTION_CHOICE" = "preview_duplicates" ]; then
            echo "Previewing duplicate cleanup..."
            npm run dedupe:players
          elif [ "$ACTION_CHOICE" = "enrich_players" ]; then
            echo "Enriching player photos and statistics..."
            npm run enrich:players
          elif [ "$ACTION_CHOICE" = "cleanup_and_enrich" ]; then
            echo "Applying duplicate cleanup..."
            npm run dedupe:players -- --apply

            echo "Enriching player photos and statistics..."
            npm run enrich:players
          else
            echo "Unknown action selected."
            exit 1
          fi
```
