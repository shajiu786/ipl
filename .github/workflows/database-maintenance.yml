name: Database Maintenance

on:
  workflow_dispatch:
    inputs:
      apply_dedupe:
        description: "Apply: import both datasets, clean duplicates, fetch photos and stats"
        required: true
        type: boolean
        default: false
      reset_mega2026:
        description: "Delete all existing mega2026 players (and rows referencing them) before importing"
        required: false
        type: boolean
        default: false
      refresh_all:
        description: "Also re-fetch photos and stats for every player (new season)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: database-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run database maintenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY_DEDUPE: ${{ inputs.apply_dedupe }}
          RESET_MEGA2026: ${{ inputs.reset_mega2026 }}
          REFRESH_ALL: ${{ inputs.refresh_all }}
          WIKI_USER_AGENT: "ipl-auction-fan-project/1.0 (https://github.com/${{ github.repository }})"
        run: |
          set -e

          cd ipl-multiplayer-auction/server

          npm install --no-package-lock

          echo "Applying database schema..."
          npm run db:schema

          if [ "$APPLY_DEDUPE" = "true" ]; then

            if [ "$RESET_MEGA2026" = "true" ]; then
              echo "Counts before reset:"
              psql "$DATABASE_URL" -c "SELECT dataset, COUNT(*) FROM players GROUP BY dataset;"

              echo "Deleting old mega2026 players and rows that reference them..."
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            FOR r IN
              SELECT c.conrelid::regclass AS tbl, a.attname AS col, a.attnotnull AS required
              FROM pg_constraint c
              JOIN pg_attribute a ON a.attrelid = c.conrelid AND a.attnum = c.conkey[1]
              WHERE c.contype = 'f' AND c.confrelid = 'players'::regclass
            LOOP
              IF r.required THEN
                EXECUTE format('DELETE FROM %s WHERE %I IN (SELECT id FROM players WHERE dataset = %L)', r.tbl, r.col, 'mega2026');
              ELSE
                EXECUTE format('UPDATE %s SET %I = NULL WHERE %I IN (SELECT id FROM players WHERE dataset = %L)', r.tbl, r.col, r.col, 'mega2026');
              END IF;
            END LOOP;
            DELETE FROM players WHERE dataset = 'mega2026';
          END $$;
          SQL

              echo "Counts after reset:"
              psql "$DATABASE_URL" -c "SELECT dataset, COUNT(*) FROM players GROUP BY dataset;"
            fi

            echo "Importing IPL Legends Auction players..."
            npm run import:csv -- ../data/ipl_auction_players_24_sets.csv --dataset=legends

            echo "Importing IPL Mega Auction 2026 players..."
            npm run import:csv -- ../data/ipl_mega_auction_2026_players.csv --dataset=mega2026

            echo "Applying duplicate cleanup..."
            npm run dedupe:players -- --apply

            echo "Enriching player photos and statistics..."
            if [ "$REFRESH_ALL" = "true" ]; then
              npm run enrich:players -- --force
            else
              npm run enrich:players
            fi

            echo "Final counts:"
            psql "$DATABASE_URL" -c "SELECT dataset, COUNT(*) FROM players GROUP BY dataset;"
          else
            echo "Previewing duplicate cleanup..."
            npm run dedupe:players
          fi
