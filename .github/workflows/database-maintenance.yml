```yaml
name: Database Maintenance

on:
  workflow_dispatch:
    inputs:
      apply_dedupe:
        description: "Import both datasets, clean duplicates, and fetch photos and stats"
        required: true
        type: boolean
        default: false

      refresh_all:
        description: "Force-refresh photos and stats for every player"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: database-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Install dependencies and test
        working-directory: ipl-multiplayer-auction/server
        run: |
          npm install --no-package-lock
          npm test

      - name: Run database maintenance
        working-directory: ipl-multiplayer-auction/server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY_DEDUPE: ${{ inputs.apply_dedupe }}
          REFRESH_ALL: ${{ inputs.refresh_all }}
          WIKI_USER_AGENT: "ipl-auction-fan-project/1.0 (https://github.com/${{ github.repository }})"
        run: |
          set -e

          echo "Applying database schema..."
          npm run db:schema

          if [ "$APPLY_DEDUPE" = "true" ]; then
            echo "Importing IPL Legends Auction players..."
            npm run import:csv -- ../data/ipl_auction_players_24_sets.csv --dataset=legends

            echo "Importing IPL Mega Auction 2026 players..."
            npm run import:csv -- ../data/ipl_mega_auction_2026_players.csv --dataset=mega2026

            echo "Applying duplicate cleanup..."
            npm run dedupe:players -- --apply

            echo "Enriching player photos and statistics..."
            if [ "$REFRESH_ALL" = "true" ]; then
              npm run enrich:players -- --force
            else
              npm run enrich:players
            fi
          else
            echo "Previewing duplicate cleanup only..."
            npm run dedupe:players
          fi
```
